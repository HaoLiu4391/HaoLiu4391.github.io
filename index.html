<style>
:root {
  --bg: #fbfbf8;
  --fg: #1b1c1a;
  --muted: #6a6c65;
  --accent: #1d6b45;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1110;
    --fg: #d5d9d2;
    --muted: #868d85;
    --accent: #8ccb9c;
    color-scheme: dark;

  --bg: #0f1110;
  --fg: #d5d9d2;
  --muted: #868d85;
  --accent: #8ccb9c;
  color-scheme: dark;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Microsoft YaHei", monospace;
}

main {
  max-width: 120ch;
  margin: 0 auto;
  padding: 28px 16px;
}

h1 {
  margin: 0 0 14px;
  font-size: 1.5rem;
  font-weight: 600;
  line-height: 1.2;
}

h1 span {
  margin-left: 12px;
  font-size: 1.1rem;
  font-weight: 400;
  color: var(--muted);
}

p {
  margin: 0 0 14px;
  overflow-wrap: anywhere;
}

a {
  color: var(--accent);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
}
